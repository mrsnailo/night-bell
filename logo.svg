<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A213B" />
      <stop offset="100%" stop-color="#0A0D17" />
    </linearGradient>

    <!-- Bell Amber/Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#FFB020" />
      <stop offset="100%" stop-color="#E67E00" />
    </linearGradient>

    <!-- Highlight Reflection -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sound Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Bell -->
  <circle cx="256" cy="265" r="140" fill="#FFB020" opacity="0.12" filter="url(#amberGlow)" />

  <!-- Radiating Sound Waves / Acoustic Waves -->
  <!-- Left Inner Wave -->
  <path d="M 120 220 A 150 150 0 0 0 120 310" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- Left Outer Wave -->
  <path d="M 80 190 A 200 200 0 0 0 80 340" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" opacity="0.5" />

  <!-- Right Inner Wave -->
  <path d="M 392 220 A 150 150 0 0 1 392 310" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- Right Outer Wave -->
  <path d="M 432 190 A 200 200 0 0 1 432 340" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" opacity="0.5" />

  <!-- Night Crescent Moon Motif in Background -->
  <path d="M 285 105 A 70 70 0 1 0 345 200 A 85 85 0 0 1 285 105 Z" fill="#3A4770" opacity="0.4" />

  <!-- Bell Top Hanger / Loop -->
  <path d="M 232 142 C 232 120, 280 120, 280 142" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Bell Clapper / Striker -->
  <circle cx="256" cy="385" r="32" fill="#E67E00" />
  <circle cx="256" cy="385" r="32" fill="url(#goldGrad)" />
  <ellipse cx="251" cy="378" rx="10" ry="6" fill="#FFF3D0" opacity="0.6" />

  <!-- Main Bell Body -->
  <path d="
    M 256 142
    C 200 142, 175 205, 175 285
    C 175 328, 162 345, 142 355
    C 142 365, 150 372, 165 372
    L 347 372
    C 362 372, 370 365, 370 355
    C 350 345, 337 328, 337 285
    C 337 205, 312 142, 256 142
    Z
  " fill="url(#goldGrad)" />

  <!-- Bell Surface Specular Curve / Highlight -->
  <path d="
    M 256 156
    C 215 156, 195 210, 195 282
    C 195 320, 185 338, 170 350
    C 180 342, 208 310, 208 275
    C 208 200, 225 158, 256 156
    Z
  " fill="url(#highlightGrad)" />

  <!-- Bell Bottom Lip Trim -->
  <path d="M 148 360 C 185 370, 327 370, 364 360" fill="none" stroke="#FFA000" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Night Sparkle / Star (Top Right) -->
  <path d="M 360 120 Q 360 135 375 135 Q 360 135 360 150 Q 360 135 345 135 Q 360 135 360 120 Z" fill="#FFE082" />
  <path d="M 150 170 Q 150 180 160 180 Q 150 180 150 190 Q 150 180 140 180 Q 150 180 150 170 Z" fill="#FFE082" opacity="0.7" />
</svg>
